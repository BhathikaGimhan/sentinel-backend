name: Deploy Backend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

env:
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  BACKEND_SERVICE: sentinel-backend-relay
  AR_REPO: sentinel-backend

jobs:
  deploy:
    name: Cloud Run + Scheduler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: gcloud config set project "$GCP_PROJECT_ID"

      - name: Enable required GCP APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudscheduler.googleapis.com \
            secretmanager.googleapis.com \
            --project="$GCP_PROJECT_ID" \
            --quiet

      - name: Verify required GitHub secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then echo "::error::Missing GitHub secret: GEMINI_API_KEY"; missing=1; fi
          if [ -z "${{ secrets.CRYPTOCOMPARE_API_KEY }}" ]; then echo "::error::Missing GitHub secret: CRYPTOCOMPARE_API_KEY"; missing=1; fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then echo "::error::Missing GitHub secret: CRON_SECRET"; missing=1; fi
          if [ -z "${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}" ]; then echo "::error::Missing GitHub secret: GCP_RUN_SERVICE_ACCOUNT"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Required GitHub secrets present"

      - name: Sync API keys to GCP Secret Manager
        env:
          RUN_SA: ${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          upsert_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Skip empty secret: $name"
              return 0
            fi
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project="$GCP_PROJECT_ID" --data-file=-
            else
              printf '%s' "$value" | gcloud secrets create "$name" \
                --project="$GCP_PROJECT_ID" \
                --replication-policy="automatic" \
                --data-file=-
              gcloud secrets add-iam-policy-binding "$name" \
                --project="$GCP_PROJECT_ID" \
                --member="serviceAccount:${RUN_SA}" \
                --role="roles/secretmanager.secretAccessor" \
                --quiet
            fi
            echo "Secret Manager OK: $name"
          }

          upsert_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          upsert_secret CRYPTOCOMPARE_API_KEY "$CRYPTOCOMPARE_API_KEY"
          upsert_secret BINANCE_API_KEY "$BINANCE_API_KEY"
          upsert_secret BINANCE_API_SECRET "$BINANCE_API_SECRET"
          upsert_secret CRON_SECRET "$CRON_SECRET"

      - name: Verify deploy IAM (fail fast with clear message)
        run: |
          set -euo pipefail
          ACTIVE="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Deploying as: $ACTIVE"
          gcloud artifacts repositories list --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --limit=1 >/dev/null
          gcloud run services list --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --limit=1 >/dev/null

      - name: Ensure Artifact Registry repo exists
        run: |
          if gcloud artifacts repositories describe "$AR_REPO" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Artifact Registry repo OK: $AR_REPO"
          else
            gcloud artifacts repositories create "$AR_REPO" \
              --repository-format=docker \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --description="Sentinel backend containers" \
              --quiet
          fi

      - name: Build and push container image
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.FIREBASE_PROJECT_ID }}/sentinel-backend/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write Cloud Run env file (non-secret config only)
        env:
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          CANDLE_SYNC_ON_STARTUP: ${{ secrets.CANDLE_SYNC_ON_STARTUP }}
          NEWS_SYNC_ON_STARTUP: ${{ secrets.NEWS_SYNC_ON_STARTUP }}
          CANDLE_SYNC_SYMBOLS: ${{ secrets.CANDLE_SYNC_SYMBOLS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          ORIGIN="${CORS_ORIGIN:-https://forex-market-ai.web.app,https://forex-market-ai.firebaseapp.com}"
          cat > /tmp/run-env.yaml <<EOF
          NODE_ENV: production
          FIREBASE_USE_ADC: "true"
          CORS_ORIGIN: "${ORIGIN}"
          CANDLE_SYNC_ON_STARTUP: "${CANDLE_SYNC_ON_STARTUP}"
          NEWS_SYNC_ON_STARTUP: "${NEWS_SYNC_ON_STARTUP:-true}"
          CANDLE_SYNC_SYMBOLS: "${CANDLE_SYNC_SYMBOLS}"
          FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
          ADMIN_EMAILS: "bgmaduragoda@gmail.com"
          ADMIN_LOCAL_PARTS: "bgmaduragoda"
          EOF

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          SECRETS=""
          for mapping in \
            "GEMINI_API_KEY:GEMINI_API_KEY" \
            "CRYPTOCOMPARE_API_KEY:CRYPTOCOMPARE_API_KEY" \
            "CRON_SECRET:CRON_SECRET" \
            "BINANCE_API_KEY:BINANCE_API_KEY" \
            "BINANCE_API_SECRET:BINANCE_API_SECRET"; do
            env_name="${mapping%%:*}"
            sm_name="${mapping#*:}"
            if gcloud secrets describe "$sm_name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              if [ -n "$SECRETS" ]; then SECRETS+=","; fi
              SECRETS+="${env_name}=${sm_name}:latest"
            fi
          done

          gcloud run deploy "$BACKEND_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --port 8787 \
            --service-account "${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}" \
            --env-vars-file /tmp/run-env.yaml \
            --set-secrets="$SECRETS" \
            --quiet

      - name: Allow public HTTP access (fixes browser 403)
        continue-on-error: true
        id: public_access
        run: |
          set -euo pipefail
          gcloud run services add-iam-policy-binding "$BACKEND_SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --member="allUsers" \
            --role="roles/run.invoker"
          echo "Public invoker binding OK"

      - name: Verify service health
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')
          echo "Service URL: $URL"

          TOKEN="$(gcloud auth print-identity-token)"
          curl -fsS -H "Authorization: Bearer ${TOKEN}" "${URL}/health" | grep -q '"status":"ok"'
          echo "Authenticated health check passed (container is running)"

          if curl -fsS "${URL}/health" | grep -q '"status":"ok"'; then
            echo "Public health check passed"
          else
            echo "::warning title=Public access blocked::Deploy succeeded but browsers will get 403 until allUsers has roles/run.invoker."
            echo "Run once as GCP Project Owner in Cloud Shell:"
            echo "gcloud run services add-iam-policy-binding $BACKEND_SERVICE --region=$GCP_REGION --project=$GCP_PROJECT_ID --member=allUsers --role=roles/run.invoker"
            if [ "${{ steps.public_access.outcome }}" != "success" ]; then
              echo "GitHub Actions deployer could not set public IAM (org policy or missing Owner permission)."
            fi
          fi

      - name: Resolve service URL
        id: url
        run: |
          URL=$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $URL"
          echo "::notice title=Backend URL::Set VITE_RELAY_URL and VITE_API_BASE_URL in frontend GitHub secrets to: $URL"

      - name: Create or update Cloud Scheduler (15M candles)
        env:
          BACKEND_URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          JOB_NAME="sentinel-candle-sync-15m"
          URI="${BACKEND_URL}/api/cron/candle-sync"
          CRON_HEADER="X-Cron-Secret=${{ secrets.CRON_SECRET }}"

          if gcloud scheduler jobs describe "$JOB_NAME" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --schedule="*/15 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --update-headers="$CRON_HEADER" \
              --quiet
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --schedule="*/15 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --headers="$CRON_HEADER" \
              --quiet
          fi

          echo "Scheduler active → $URI"

      - name: Create or update Cloud Scheduler (news feed)
        env:
          BACKEND_URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          JOB_NAME="sentinel-news-sync-10m"
          URI="${BACKEND_URL}/api/cron/news-sync"
          CRON_HEADER="X-Cron-Secret=${{ secrets.CRON_SECRET }}"

          if gcloud scheduler jobs describe "$JOB_NAME" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --schedule="*/10 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --update-headers="$CRON_HEADER" \
              --quiet
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --schedule="*/10 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --headers="$CRON_HEADER" \
              --quiet
          fi

          echo "News scheduler active → $URI (every 10 min)"
