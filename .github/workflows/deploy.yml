name: Deploy Backend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

env:
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  BACKEND_SERVICE: sentinel-backend-relay
  AR_REPO: sentinel-backend

jobs:
  deploy:
    name: Cloud Run + Scheduler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: gcloud config set project "$GCP_PROJECT_ID"

      - name: Enable required GCP APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudscheduler.googleapis.com \
            --project="$GCP_PROJECT_ID" \
            --quiet

      - name: Verify deploy IAM (fail fast with clear message)
        run: |
          set -euo pipefail
          ACTIVE="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Deploying as: $ACTIVE"
          gcloud artifacts repositories list --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --limit=1 >/dev/null
          gcloud run services list --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --limit=1 >/dev/null

      - name: Ensure Artifact Registry repo exists
        run: |
          if gcloud artifacts repositories describe "$AR_REPO" \
            --location="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Artifact Registry repo OK: $AR_REPO"
          else
            gcloud artifacts repositories create "$AR_REPO" \
              --repository-format=docker \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --description="Sentinel backend containers" \
              --quiet
          fi

      - name: Build and push container image
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.FIREBASE_PROJECT_ID }}/sentinel-backend/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write Cloud Run env file
        env:
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          CANDLE_SYNC_ON_STARTUP: ${{ secrets.CANDLE_SYNC_ON_STARTUP }}
          CANDLE_SYNC_SYMBOLS: ${{ secrets.CANDLE_SYNC_SYMBOLS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: |
          cat > /tmp/run-env.yaml <<EOF
          NODE_ENV: production
          FIREBASE_USE_ADC: "true"
          CORS_ORIGIN: "${CORS_ORIGIN}"
          CANDLE_SYNC_ON_STARTUP: "${CANDLE_SYNC_ON_STARTUP}"
          CANDLE_SYNC_SYMBOLS: "${CANDLE_SYNC_SYMBOLS}"
          FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
          GEMINI_API_KEY: "${GEMINI_API_KEY}"
          BINANCE_API_KEY: "${BINANCE_API_KEY}"
          BINANCE_API_SECRET: "${BINANCE_API_SECRET}"
          CRON_SECRET: "${CRON_SECRET}"
          CRYPTOCOMPARE_API_KEY: "${CRYPTOCOMPARE_API_KEY}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --port 8787 \
            --service-account "${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}" \
            --env-vars-file /tmp/run-env.yaml \
            --quiet

      - name: Resolve service URL
        id: url
        run: |
          URL=$(gcloud run services describe "$BACKEND_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $URL"
          echo "::notice title=Backend URL::Set VITE_RELAY_URL and VITE_API_BASE_URL in frontend GitHub secrets to: $URL"

      - name: Create or update Cloud Scheduler (15M candles)
        env:
          BACKEND_URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          JOB_NAME="sentinel-candle-sync-15m"
          URI="${BACKEND_URL}/api/cron/candle-sync"
          CRON_HEADER="X-Cron-Secret=${{ secrets.CRON_SECRET }}"

          if gcloud scheduler jobs describe "$JOB_NAME" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --schedule="*/15 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --update-headers="$CRON_HEADER" \
              --quiet
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --schedule="*/15 * * * *" \
              --uri="$URI" \
              --http-method=POST \
              --headers="$CRON_HEADER" \
              --quiet
          fi

          echo "Scheduler active → $URI"
